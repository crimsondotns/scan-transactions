name: Deploy to GitHub Pages

on:
  push:
    branches: [xcap-scan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # ที่อยู่ของ API wrapper เป็นค่าสาธารณะ → เก็บเป็น repository "variable" ไม่ใช่ secret
      # ห้ามส่ง secret ใดๆ เข้าขั้นตอน build: ทุกค่า VITE_* จะจบอยู่ใน bundle ที่ทุกคนอ่านได้
      - run: pnpm build
        env:
          VITE_WRAPPER_URL: ${{ vars.API_WRAPPER_URL }}
      # ด่านสุดท้าย: สแกน dist/ ว่าไม่มีกุญแจ/โทเคนหลุดเข้าไป
      - run: pnpm check:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
