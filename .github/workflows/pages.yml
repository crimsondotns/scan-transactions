name: Deploy to GitHub Pages

on:
  push:
    branches: [xcap-scan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ยกเลิกงานที่ค้างไม่ได้ช่วยอะไรกับ Pages: ตัว deployment ที่ถูกสร้างไปแล้วยังค้างอยู่ฝั่ง GitHub
# แล้วรันถัดไปจะเจอ "in progress deployment" — จึงให้รอคิวแทนการยกเลิก
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # ค่าตั้งต้นของแอป — เก็บใน GitHub Secrets เพื่อไม่ให้ URL อยู่ในซอร์ส
      # ⚠️ เว็บนี้เป็น static: ค่าที่ส่งเข้า build จะอยู่ใน dist/ ที่ทุกคนอ่านได้ ไม่ใช่ความลับหลัง deploy
      - run: pnpm build
        env:
          VITE_SOURCES: ${{ secrets.SOURCES }}
          VITE_CHAIN_LIST_URL: ${{ secrets.CHAIN_LIST_URL }}
          VITE_CHAINS: ${{ secrets.CHAINS }}
          # ค่าที่ตั้งใจฝังลง bundle อาจหน้าตาเหมือนกุญแจ → ให้ด่านสแกนเตือนแทนล้ม
          ALLOW_EMBEDDED_KEYS: '1'
      # ด่านสุดท้าย: สแกน dist/ ว่าไม่มีกุญแจ/โทเคนหลุดเข้าไป (หน้าเว็บ static = ทุกไบต์สาธารณะ)
      - run: pnpm check:dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
