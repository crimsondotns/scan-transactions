# ตั้งค่าของ API wrapper — ไฟล์นี้อยู่ใน git จึงมีได้เฉพาะค่าที่ไม่ลับ
# ความลับ (URL ปลายทาง + กุญแจ) ตั้งด้วย `wrangler secret put` เท่านั้น ดู README.md
name = "xcap-api-wrapper"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# origin ของหน้าเว็บที่เรียกได้ คั่นด้วยจุลภาค (ไม่มี wildcard)
# ⚠️ ต้องใส่ ไม่งั้น Worker จะ 403 ทุก request
ALLOWED_ORIGINS = "https://crimsondotns.github.io,http://localhost:5174"

# คำขอต่อ IP ต่อนาที — เพิ่มจาก 60 → 300 เพราะออฟฟิศใช้ IP ร่วมกัน
RATE_LIMIT_PER_MIN = "300"

# อายุ cache (วินาที) — 0 = ปิด cache
# 60 วิ = สดพอสำหรับดูธุรกรรม แต่ลด request ซ้ำได้ 90%+
CACHE_TTL_SECONDS = "60"

# ชื่อ header ยืนยันตัวตนของแต่ละปลายทาง (ไม่ลับ) เช่น UPSTREAM_MAIN_AUTH_HEADER = "x-api-key"
# UPSTREAM_MAIN_AUTH_HEADER = ""

# ตัวจำกัดอัตราของแพลตฟอร์ม (ถ้าบัญชีรองรับ) — เปิดใช้แล้วโค้ดจะใช้ตัวนี้แทนตัวนับในหน่วยความจำ
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 300, period = 60 }